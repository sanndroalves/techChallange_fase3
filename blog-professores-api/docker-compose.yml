services:

  api:

    build: .

    container_name: blog-professores-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongodb

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: npm run dev

  mongodb:

    image: mongo:8.0

    container_name: blog-professores-mongodb

    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: blog_professores

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  node_modules: